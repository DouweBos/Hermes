name: Bug report
description: Something in Hermes doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drag a file from Finder
        2. Drop it on the shelf
        3. ...
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes version
      description: From Get Info on Hermes.app in Finder, or "built from source at <commit>".
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.4 on an M2 MacBook Air
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, recordings, the app you dragged from or to, or crash logs from Console.app.
