name: Feature request
description: Suggest an idea or improvement for Hermes.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Hermes to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
